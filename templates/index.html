<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The MealDB Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <nav class="top-nav">
    <a href="{{ url_for('home') }}">Search</a>
    <a href="{{ url_for('favorites_page') }}">Favorites</a>
  </nav>
  <div id="recipe-modal" class="modal-hidden">
  
    <div class="modal-content">
      
      <div id="modal-body">
      </div>

    </div>

  </div>

  <h1>The MealDB Finder</h1>

  <form id="search-form" onsubmit="event.preventDefault(); search();">
    <input type="text" id="ingredient" placeholder="Search a main ingredient">
    <button type="submit">Search</button>
  </form> 

  <div id="results"></div>

  <script src="{{ url_for('static', filename='utils.js') }}"></script>
  <script>
    async function search() {
      const input = document.getElementById("ingredient").value;

      const res = await fetch(`/search/${input}`);
      
      const data = await res.json();

      renderCards(data);
    }

    function renderCards(data) {
      const results = document.getElementById("results");
      results.replaceChildren();
      const meals = data.meals;
      const favs = JSON.parse(localStorage.getItem("favorites")) || [];


      if (!meals) {
        const error = document.createElement("h3");
        error.textContent = "No recipes found. Try another ingredient!";
        results.appendChild(error);
        return;
      }

      meals.forEach(meal => {
        const name = meal.strMeal;
        const image = meal.strMealThumb;
        const id = meal.idMeal;
        const ap = favs.includes(id);
        const card = document.createElement("div");
        card.className = "mealCard";

        const img = document.createElement("img");
        img.src = image;
        img.alt = "Image not available";

        const cardContent = document.createElement("div");
        cardContent.className = "cardContent";

        const titleRow = document.createElement("div");
        titleRow.className = "title-row";

        const h3 = document.createElement("h3");
        h3.textContent = name;

        const btn = document.createElement("button");
        btn.setAttribute("aria-pressed", ap);
        btn.addEventListener("click", () => favorite(btn, id));

        const btn2 = document.createElement("button");
        btn2.addEventListener("click", () => openRecipe(id))
        btn2.textContent = "View Recipe"

        titleRow.appendChild(h3);
        titleRow.appendChild(btn);
        cardContent.appendChild(titleRow);
        cardContent.appendChild(btn2)
        card.appendChild(img);
        card.appendChild(cardContent);

        results.appendChild(card);

      });
    }
  </script>

</body>
</html>
