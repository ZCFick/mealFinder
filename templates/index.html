<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The MealDB Finder</title>
  <link rel="stylesheet" href="../static/style.css">
</head>

<body>
  <div id="recipe-modal" class="modal-hidden">
  
    <div class="modal-content">
      
      <div id="modal-body">
      </div>

    </div>

  </div>

  <h1>The MealDB Finder</h1>

  <form id="search-form" onsubmit="event.preventDefault(); search();">
    <input type="text" id="ingredient" placeholder="Search a main ingredient">
    <button type="submit">Search</button>
  </form> 

  <div id="results"></div>

  <script>
    async function search() {
      const input = document.getElementById("ingredient").value;

      const res = await fetch(`/search/${input}`)
      
      const data = await res.json()

      renderCards(data)
    }

    function renderCards(data) {
      const results = document.getElementById("results")
      results.innerHTML = ""
      const meals = data.meals
      const favs = JSON.parse(localStorage.getItem("favorites")) || []


      if (!meals) {
        results.innerHTML = "<p3>No recipes found. Try another ingredient!</p3>";
        return;
      }

      meals.forEach(meal => {
        const name = meal.strMeal
        const image = meal.strMealThumb
        const id = meal.idMeal
        console.log(typeof id, id)
        console.log(typeof favs[0], favs[0])
        console.log(favs.includes(id))
        const ap = favs.includes(id)
        results.innerHTML += `
        <div class="mealCard">
          <img src="${image}" alt="Image not avaliable">
          <div class="cardContent">
            <div class="title-row">
              <h3>${name}</h3>
              <button aria-pressed="${ap}" onclick="favorite(this,${id})"></button>
            </div>
            <button onclick="openRecipe(${id})">View Recipe</button>
          </div>
        </div>
        `

      });
    }

    async function openRecipe(id) {
      const res = await fetch(`/recipe/${id}`)
      const data = await res.json()
      
      let ing = ""

      data.ingredients.forEach(ingred => {
        ing += ingred + '<br>'
      });

      const body = document.getElementById("modal-body")
      body.innerHTML = ""
      body.innerHTML += `
      <span id="close-button" onclick="closeModal()">&times;</span>
      <img src=${data.image} alt="Image Not Avaliable" class="modal-image">
      <h2>${data.name} (${data.location})</h2>
      <h3>Ingedient List</h3>
      <p>${ing}</p>
      <h3>Instructions</h3>
      <p>${data.instructions}</p>
      <button id="make-favorite">Favorite</button>
      `

      const modal = document.getElementById("recipe-modal")

      modal.style.display = 'flex'
    }

    function closeModal() {
      const modal = document.getElementById("recipe-modal");
    
      modal.style.display = 'none';
    }

    function favorite(btn, id) {
      const isPressed = btn.getAttribute('aria-pressed') === 'true';
      if (isPressed) {
          removeFromFavorites(id);
      } else {
          addToFavorites(id);
      }

      btn.setAttribute('aria-pressed', !isPressed);
    }

    function addToFavorites(id) {
      const favs = JSON.parse(localStorage.getItem("favorites")) || []
      favs.push(id.toString())
      console.log(favs)
      localStorage.setItem("favorites", JSON.stringify(favs))
    }

    function removeFromFavorites(id) {
      const favs = JSON.parse(localStorage.getItem("favorites")) || []
      const updated = favs.filter(ids => ids !== id.toString())
      
      console.log(updated)
      localStorage.setItem("favorites", JSON.stringify(updated))
    }
  </script>

</body>
</html>
